<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="fgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animate attributeName="x1" values="0%;25%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;125%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" fill="#0a1120"/>
  <path d="M-200 26 Q 100 56 400 26 T 1000 26 T 1600 26 V 0 H -200 Z" fill="url(#fwave)">
