<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330">
  <defs>
    <linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="780" height="330" rx="14" fill="#0d1626"/>
  <rect width="780" height="44" rx="14" fill="#122036"/>
  <rect y="30" width="780" height="14" fill="#122036"/>
  <circle cx="26" cy="22" r="7" fill="#f87171"/>
  <circle cx="52" cy="22" r="7" fill="#fbbf24"/>
  <circle cx="78" cy="22" r="7" fill="#4ade80"/>
  <text x="390" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7d99bd">Windows PowerShell — CursorMemo installer</text>

  <g font-family="Consolas, 'SF Mono', monospace" font-size="16.5">
    <text x="26" y="84" fill="#e6f2ff">PS C:\&gt; <tspan fill="#7dd3fc">irm https://cursormemo.funapp.live/install.ps1 | iex</tspan>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.03;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="122" fill="#4ade80">[ok] Engine ai-memory 3.1.1 — SHA-256 verified
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="154" fill="#4ade80">[ok] Cursor config backed up to ~/.cursormemo/backups
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.34;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="186" fill="#4ade80">[ok] MCP server + lifecycle hooks wired into Cursor
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.50;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="218" fill="#4ade80">[ok] Existing settings preserved — nothing overwritten
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.64;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="262" font-size="18" font-weight="700" fill="url(#tgrad)">Done. Restart Cursor — your AI now remembers.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="300" fill="#e6f2ff">PS C:\&gt;
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.85;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="104" y="282" width="10" height="20" fill="#7dd3fc">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
