<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300">
  <defs>
    <radialGradient id="hub" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".7" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <rect width="1040" height="300" rx="16" fill="#0a1120"/>

  <!-- links (marching ants) -->
  <g stroke="#2b4a73" stroke-width="2.2" stroke-dasharray="7 8">
    <line x1="520" y1="150" x2="196" y2="66"><animate attributeName="stroke-dashoffset" values="30;0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="520" y1="150" x2="196" y2="234"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="520" y1="150" x2="392" y2="52"><animate attributeName="stroke-dashoffset" values="30;0" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="520" y1="150" x2="648" y2="52"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="520" y1="150" x2="844" y2="66"><animate attributeName="stroke-dashoffset" values="30;0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="520" y1="150" x2="844" y2="234"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- hub -->
  <circle cx="520" cy="150" r="52" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2">
    <animate attributeName="r" values="52;66;52" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".55;.1;.55" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="150" r="44" fill="url(#hub)"/>
  <text x="520" y="144" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">MEMORY</text>
  <text x="520" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#dbeafe">markdown wiki</text>

  <!-- satellite cards -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="600" fill="#e6f2ff">
    <g>
      <rect x="86" y="40" width="220" height="52" rx="12" fill="#0f1f38" stroke="#22d3ee" stroke-opacity=".55"/>
      <circle cx="112" cy="66" r="6" fill="#22d3ee"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="130" y="72">Decisions</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="86" y="208" width="220" height="52" rx="12" fill="#0f1f38" stroke="#f472b6" stroke-opacity=".5"/>
      <circle cx="112" cy="234" r="6" fill="#f472b6"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="130" y="240">Bugs &amp; fixes</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="282" y="14" width="220" height="52" rx="12" fill="#0f1f38" stroke="#38bdf8" stroke-opacity=".55"/>
      <circle cx="308" cy="40" r="6" fill="#38bdf8"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="326" y="46">Open tasks</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="4.1s" begin="0.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="538" y="14" width="220" height="52" rx="12" fill="#0f1f38" stroke="#818cf8" stroke-opacity=".55"/>
      <circle cx="564" cy="40" r="6" fill="#818cf8"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="582" y="46">Session summaries</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="4.6s" begin="0.9s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="734" y="40" width="220" height="52" rx="12" fill="#0f1f38" stroke="#a855f7" stroke-opacity=".55"/>
      <circle cx="760" cy="66" r="6" fill="#a855f7"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="778" y="72">Rules &amp; preferences</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4.3s" begin="0.3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="734" y="208" width="220" height="52" rx="12" fill="#0f1f38" stroke="#4ade80" stroke-opacity=".5"/>
      <circle cx="760" cy="234" r="6" fill="#4ade80"><animate attributeName="opacity" values=".3;1;.3" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="778" y="240">Architecture notes</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="4.9s" begin="0.7s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
