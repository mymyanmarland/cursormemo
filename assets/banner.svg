<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;130%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="#0a1120"/>
  <circle cx="180" cy="150" r="190" fill="url(#glow)"/>
  <circle cx="1030" cy="60" r="150" fill="url(#glow)" opacity=".6"/>

  <!-- floating particles -->
  <g fill="#7dd3fc">
    <circle cx="420" cy="70" r="3"><animate attributeName="cy" values="70;52;70" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.3;.9" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="46" r="2.4"><animate attributeName="cy" values="46;64;46" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.95;.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="90" r="3"><animate attributeName="cy" values="90;72;90" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.35;.8" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="150" r="2.2"><animate attributeName="cy" values="150;132;150" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="2"><animate attributeName="cy" values="120;104;120" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.3;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="130" r="2.6"><animate attributeName="cy" values="130;146;130" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;.9;.35" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- animated waves -->
  <g>
    <path d="M-200 285 Q 100 245 400 285 T 1000 285 T 1600 285 V 340 H -200 Z" fill="url(#wave1)" opacity=".5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 305 Q 150 272 500 305 T 1200 305 T 1900 305 V 340 H -200 Z" fill="url(#wave1)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0; -300 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- logo: stacked layers + cursor arrow -->
  <g transform="translate(105,88)">
    <g>
      <rect x="0" y="66" width="130" height="30" rx="10" fill="#164e63">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="36" width="130" height="30" rx="10" fill="#0369a1">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="6" width="130" height="30" rx="10" fill="url(#grad)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(88,58)">
      <polygon points="0,0 44,20 26,26 38,52 26,58 14,32 -2,44" fill="#ffffff" stroke="#0a1120" stroke-width="3" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0 20 24; -7 20 24; 0 20 24" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1;.85;1" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="300" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="800" fill="url(#grad)" letter-spacing="1">CursorMemo</text>
  <text x="304" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="29" fill="#cfe6ff">Long-term memory for AI coding agents</text>
  <text x="304" y="234" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#8fb0d8">Your AI picks up exactly where you left off — every session.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#dff3ff">
    <g transform="translate(304,256)">
      <rect width="168" height="36" rx="18" fill="#0f1f38" stroke="#22d3ee" stroke-opacity=".6"/>
      <circle cx="24" cy="18" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="40" y="24">Local-first</text>
    </g>
    <g transform="translate(488,256)">
      <rect width="178" height="36" rx="18" fill="#0f1f38" stroke="#38bdf8" stroke-opacity=".6"/>
      <circle cx="24" cy="18" r="5" fill="#38bdf8"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="40" y="24">No API key</text>
    </g>
    <g transform="translate(682,256)">
      <rect width="216" height="36" rx="18" fill="#0f1f38" stroke="#a855f7" stroke-opacity=".6"/>
      <circle cx="24" cy="18" r="5" fill="#a855f7"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="40" y="24">Open source · MIT</text>
    </g>
  </g>
</svg>
