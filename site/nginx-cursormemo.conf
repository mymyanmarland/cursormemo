# cursormemo.funapp.live - CursorMemo one-click installer hosting (static)
server {
    server_name cursormemo.funapp.live;
    access_log /var/log/nginx/vhost/cursormemo-funapp-live.access.log vhost;
    root /var/www/cursormemo;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    listen 80;
}
